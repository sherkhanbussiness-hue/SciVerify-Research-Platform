kind = "web"
previewPath = "/"
title = "SciVerify"
description = "A scientific code-execution reliability harness for evaluating whether AI-generated code runs, produces correct results, and remains reproducible across real scientific tasks."
version = "1.0.0"
id = "artifacts/sciverify"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25889

[services.development]
run = "pnpm --filter @workspace/sciverify run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sciverify", "run", "build" ]
serve = "static"
publicDir = "artifacts/sciverify/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25889"
BASE_PATH = "/"
